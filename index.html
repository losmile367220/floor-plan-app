<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7f7fb">
<title>Floor Plan</title>
<style>
:root{
  --bg:#f6f6fa;--panel:#fff;--text:#18181d;--muted:#777783;--line:#dddde5;
  --accent:#6c63ff;--danger:#d94b4b;--shadow:0 10px 30px rgba(0,0,0,.10)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit} button{border:0;background:none;color:inherit;cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column}
header{height:62px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff;border-bottom:1px solid var(--line);z-index:20}
.brand{font-size:19px;font-weight:850;white-space:nowrap}.floor-tabs{display:flex;gap:6px;overflow:auto;flex:1}
.floor-tab{padding:8px 12px;background:#f0f0f5;border-radius:10px;font-weight:750;white-space:nowrap}
.floor-tab.active{background:#18181d;color:#fff}
.group-bar{position:fixed;left:50%;top:72px;transform:translateX(-50%);z-index:88;display:none;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px 10px}
.group-bar.show{display:flex}.group-bar strong{font-size:13px;white-space:nowrap}
.cloud-panel{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-8px);z-index:94;display:none;width:min(440px,calc(100% - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.cloud-panel.show{display:block;transform:translateX(-50%) translateY(0)}
.backup-panel{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-8px);z-index:92;display:none;width:min(420px,calc(100% - 24px));background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.backup-panel.show{display:block;transform:translateX(-50%) translateY(0)}
.floor-menu{position:fixed;z-index:90;display:none;min-width:170px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.floor-menu.show{display:grid;gap:4px}.floor-menu button{padding:10px 12px;text-align:left;border-radius:9px;font-weight:700}.floor-menu button:hover{background:#f1f1f5}
.top-actions{display:flex;gap:6px}
.icon-btn,.tool{min-width:42px;height:42px;border-radius:12px;background:#f1f1f6;display:flex;align-items:center;justify-content:center;font-weight:750}
.workspace{flex:1;min-height:0;display:flex}.sidebar{width:96px;padding:10px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px;z-index:10;overflow:auto}
.tool{height:58px;flex-direction:column;gap:2px;font-size:12px;flex-shrink:0}.tool .emoji{font-size:20px}.tool.active{background:#18181d;color:#fff}
.canvas-wrap{position:relative;flex:1;overflow:hidden;background:#ececf2;touch-action:none}canvas{display:block;width:100%;height:100%;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.status{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.94);box-shadow:var(--shadow);padding:8px 11px;border-radius:10px;font-size:12px;color:var(--muted);pointer-events:none;max-width:70%}
.zoom{position:absolute;right:14px;bottom:14px;background:#fff;box-shadow:var(--shadow);border-radius:14px;padding:6px;display:flex;align-items:center;gap:4px}
.zoom button{width:38px;height:38px;border-radius:10px;background:#f1f1f6;font-size:18px;font-weight:800}.zoom span{min-width:50px;text-align:center;font-size:12px;color:var(--muted)}
.bottom{display:none;height:72px;background:#fff;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:20}.bottom .tool{flex:1;height:55px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;display:none}.modal-backdrop.show{display:block}
.library{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(105%);width:min(760px,100%);max-height:72dvh;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);z-index:50;transition:.2s ease;display:flex;flex-direction:column}
.library.show{transform:translateX(-50%) translateY(0)}
.custom-panel{position:fixed;left:50%;bottom:0;transform:translateX(-50%) translateY(105%);width:min(520px,100%);background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);z-index:55;transition:.2s ease}
.custom-panel.show{transform:translateX(-50%) translateY(0)}.lib-head{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.lib-head strong{font-size:17px;flex:1}.close{width:38px;height:38px;border-radius:50%;background:#f1f1f5;font-size:20px}
.cats{display:flex;gap:7px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--line)}.cat{padding:8px 12px;background:#f1f1f5;border-radius:999px;white-space:nowrap;font-weight:700;font-size:13px}.cat.active{background:#18181d;color:#fff}
.items{padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;overflow:auto}.item{min-height:84px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}.item .ico{font-size:30px}.item span:last-child{font-size:12px;font-weight:700;text-align:center}
.props{position:fixed;right:16px;top:78px;width:225px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);z-index:25;padding:12px;display:none}.props.show{display:block}.props h3{margin:0 0 10px;font-size:15px}.row{display:flex;gap:7px;align-items:center;margin-top:8px}.row label{font-size:12px;color:var(--muted);width:48px}.row input{min-width:0;flex:1;padding:8px;border:1px solid var(--line);border-radius:9px}.smallbtn{flex:1;padding:9px 8px;border-radius:9px;background:#f1f1f5;font-weight:750;font-size:12px}.danger{color:var(--danger)}
.toast{position:fixed;left:50%;top:78px;transform:translateX(-50%) translateY(-10px);padding:9px 14px;background:#18181d;color:#fff;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.18s;z-index:80}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Mobile-only UI. Desktop layout above remains unchanged. */
.mobile-only{display:none!important}
.mobile-more-panel{display:none}
@media(max-width:760px){
 html,body{overscroll-behavior:none}
 .app{height:100dvh}
 header{height:58px;padding:0 8px;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
 .brand{font-size:16px;max-width:126px;overflow:hidden;text-overflow:ellipsis}
 .floor-tabs{display:none}
 .top-actions{margin-left:auto;gap:5px}
 .top-actions>button{display:none!important}
 .mobile-only{display:flex!important}
 .mobile-floor-btn{height:42px;min-width:58px;padding:0 10px;border-radius:12px;background:#18181d;color:#fff;font-weight:800;align-items:center;justify-content:center;gap:4px}
 .mobile-head-btn{width:42px;height:42px;border-radius:12px;background:#f1f1f6;align-items:center;justify-content:center;font-size:18px}
 .workspace{min-height:0}.sidebar{display:none}
 .canvas-wrap{background:#fff}
 .status{top:8px;left:8px;max-width:calc(100% - 16px);font-size:11px;padding:7px 9px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
 .zoom{right:10px;bottom:10px;padding:5px;border-radius:16px}.zoom button{width:44px;height:44px}.zoom span{min-width:58px;font-size:13px}
 .bottom{display:flex;height:78px;gap:3px;padding:6px 5px calc(6px + env(safe-area-inset-bottom));flex-shrink:0}
 .bottom .tool{min-width:0;height:60px;padding:3px 1px;border-radius:13px;font-size:11px}.bottom .tool .emoji{font-size:20px}
 .items{grid-template-columns:repeat(3,1fr)}
 .props{top:auto;right:8px;left:8px;bottom:86px;width:auto;max-height:45dvh;overflow:auto;border-radius:18px}
 .group-bar{top:64px;max-width:calc(100% - 16px)}
 .cloud-panel,.backup-panel{top:68px;width:calc(100% - 16px);max-height:calc(100dvh - 155px);overflow:auto}
 .library,.custom-panel{max-height:78dvh}
 .library{border-radius:22px 22px 0 0}.custom-panel{border-radius:22px 22px 0 0}
 .floor-menu{min-width:190px}
 .mobile-more-panel{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:96;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;grid-template-columns:repeat(4,1fr);gap:8px;max-height:58dvh;overflow:auto}
 .mobile-more-panel.show{display:grid}
 .mobile-more-panel button{min-height:62px;border-radius:14px;background:#f4f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:750;padding:5px}
 .mobile-more-panel button span{font-size:21px}
 .mobile-more-panel .wide{grid-column:span 2;min-height:48px;flex-direction:row;font-size:12px}
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="app">
<header>
  <div class="brand">🏠 Floor Plan</div>
  <div class="floor-tabs" id="floorTabs"></div>
  <div class="top-actions">
    <button class="icon-btn optional" id="undoBtn" title="復原">↶</button>
    <button class="icon-btn optional" id="redoBtn" title="重做">↷</button>
    <button class="icon-btn" id="addFloorBtn" title="新增樓層">＋F</button>
    <button class="icon-btn" id="groupModeBtn" title="多選並鎖在一起">🔗</button>
    <button class="icon-btn" id="selectAllBtn" title="全選目前樓層">☑️</button>
    <button class="icon-btn" id="copyFloorBtn" title="複製目前樓層全部物件">📋</button>
    <button class="icon-btn" id="pasteFloorBtn" title="貼到目前樓層">📥</button>
    <button class="icon-btn" id="snapBtn" title="物件吸附格線：關">🧲</button>
    <button class="icon-btn" id="saveBtn" title="儲存進度">💾</button>
    <button class="icon-btn" id="backupBtn" title="JSON 備份 / 還原">📦</button>
    <button class="icon-btn" id="cloudBtn" title="Google Drive 雲端">☁️</button>
    <button class="icon-btn" id="exportBtn" title="匯出 PNG">⬇</button>
    <button class="mobile-only mobile-floor-btn" id="mobileFloorBtn" title="切換樓層">1F⌄</button>
    <button class="mobile-only mobile-head-btn" id="mobileCloudBtn" title="Google Drive 雲端">☁️</button>
    <button class="mobile-only mobile-head-btn" id="mobileMoreBtn" title="更多工具">•••</button>
  </div>
</header>

<div class="workspace">
<aside class="sidebar">
  <button class="tool active" data-tool="select"><span class="emoji">👆</span>選取</button>
  <button class="tool" data-tool="wall"><span class="emoji">🧱</span>牆</button>
  <button class="tool" data-tool="door"><span class="emoji">🚪</span>門</button>
  <button class="tool" data-tool="window"><span class="emoji">🪟</span>窗</button>
  <button class="tool" data-tool="library"><span class="emoji">🛋️</span>家具</button>
  <button class="tool" data-tool="shape"><span class="emoji">⬜</span>圖形</button>
  <button class="tool" data-tool="text"><span class="emoji">T</span>文字</button>
  <button class="tool" data-tool="pan"><span class="emoji">✋</span>移動畫布</button>
  <button class="tool" id="deleteBtn"><span class="emoji">🗑️</span>刪除</button>
</aside>

<main class="canvas-wrap" id="canvasWrap">
  <canvas id="canvas"></canvas>
  <div class="status" id="status">選取：點牆或家具後可拖曳</div>
  <div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button></div>
</main>
</div>

<nav class="bottom">
  <button class="tool active" data-tool="select"><span class="emoji">👆</span>選取</button>
  <button class="tool" data-tool="wall"><span class="emoji">🧱</span>牆</button>
  <button class="tool" data-tool="door"><span class="emoji">🚪</span>門</button>
  <button class="tool" data-tool="window"><span class="emoji">🪟</span>窗</button>
  <button class="tool" data-tool="library"><span class="emoji">🛋️</span>家具</button>
  <button class="tool" data-tool="more"><span class="emoji">＋</span>更多</button>
</nav>
</div>

<div class="mobile-more-panel" id="mobileMorePanel">
  <button id="mUndo"><span>↶</span>復原</button><button id="mRedo"><span>↷</span>重做</button>
  <button id="mShape"><span>⬜</span>圖形</button><button id="mText"><span>Ｔ</span>文字</button>
  <button id="mPan"><span>✋</span>移動畫布</button><button id="mDelete"><span>🗑️</span>刪除</button>
  <button id="mSelectAll"><span>☑️</span>全選</button><button id="mGroup"><span>🔗</span>群組</button>
  <button id="mCopy"><span>📋</span>複製樓層</button><button id="mPaste"><span>📥</span>貼上</button>
  <button id="mSnap"><span>🧲</span>格線吸附</button><button id="mSave"><span>💾</span>本機儲存</button>
  <button id="mBackup"><span>📦</span>JSON備份</button><button id="mExport"><span>⬇️</span>匯出PNG</button>
  <button class="wide" id="mAddFloor"><span>＋</span>新增樓層</button><button class="wide" id="mCloud"><span>☁️</span>Google Drive</button>
</div>

<div class="props" id="props">
  <h3 id="propTitle">物件</h3>
  <div class="row"><label>寬</label><input id="propW" type="number" min="20" step="10"><span>cm</span></div>
  <div class="row"><label>深</label><input id="propH" type="number" min="20" step="10"><span>cm</span></div>
  <div class="row" id="doorDirectionRow" style="display:none"><label>門向</label><button class="smallbtn" id="doorLeftRight">左右翻轉</button><button class="smallbtn" id="doorInOut">內外翻轉</button></div>
  <div class="row" id="stairsDirectionRow" style="display:none"><label>樓梯</label><button class="smallbtn" id="stairsDirection">切換 上 / 下</button></div>
  <div class="row" id="textDirectionRow" style="display:none"><label>文字</label><button class="smallbtn" id="textDirection">橫 ↔ 直</button></div>
  <div class="row"><button class="smallbtn" id="rotateLeft">↶ 旋轉</button><button class="smallbtn" id="rotateRight">↷ 旋轉</button></div>
  <div class="row" id="groupInfoRow" style="display:none"><button class="smallbtn" id="ungroupBtn">🔓 解除群組</button></div>
  <div class="row"><button class="smallbtn" id="duplicateBtn">⧉ 複製</button><button class="smallbtn danger" id="propDelete">🗑 刪除</button></div>
</div>

<div class="custom-panel" id="customPanel">
  <div class="lib-head"><strong id="customTitle">新增</strong><button class="close" id="closeCustom">×</button></div>
  <div style="padding:14px;display:grid;gap:10px">
    <div id="shapeChoices" style="display:none;grid-template-columns:repeat(4,1fr);gap:8px;max-height:55dvh;overflow:auto"></div>
    <div id="textChoices" style="display:none;gap:8px">
      <input id="customText" placeholder="輸入文字，例如：主臥、神明桌" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="smallbtn" id="addTextH">橫向文字</button>
        <button class="smallbtn" id="addTextV">直向文字</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="backdrop"></div>
<div class="library" id="library">
  <div class="lib-head"><strong>彩色俯視家具・設備</strong><button class="close" id="closeLibrary">×</button></div>
  <div class="cats" id="cats"></div>
  <div class="items" id="items"></div>
</div>
<div class="group-bar" id="groupBar">
  <strong id="groupCount">已選 0 個</strong>
  <button class="smallbtn primary" id="makeGroupBtn">🔗 鎖一起</button>
  <button class="smallbtn" id="cancelGroupBtn">取消</button>
</div>

<div class="cloud-panel" id="cloudPanel">
  <div class="lib-head">
    <strong>☁️ Google Drive 雲端</strong>
    <button class="close" id="closeCloud">×</button>
  </div>
  <div style="padding:14px;display:grid;gap:10px">
    <div id="cloudStatus" style="font-size:13px;color:var(--muted);line-height:1.55">尚未登入 Google</div>
    <div id="googleSignInWrap"><div id="googleSignInButton"></div></div>
    <div id="cloudClientSetup" style="display:none">
      <label style="font-size:12px;color:var(--muted)">Google OAuth Web Client ID</label>
      <input id="cloudClientIdInput" placeholder="xxxxxxxx.apps.googleusercontent.com"
             style="width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:10px">
      <button class="smallbtn primary" id="saveCloudClientId" style="margin-top:8px">儲存 Client ID</button>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5">只需設定一次，會存在這台裝置的瀏覽器。</div>
    </div>
    <div id="cloudActions" style="display:none;grid-template-columns:1fr 1fr;gap:8px">
      <button class="smallbtn primary" id="cloudSaveBtn">☁️ 儲存到雲端</button>
      <button class="smallbtn" id="cloudLoadBtn">⬇ 從雲端載入</button>
    </div>
    <div id="cloudSyncInfo" style="font-size:12px;color:var(--muted)">最後同步：尚未同步</div>
    <button class="smallbtn" id="cloudLogoutBtn" style="display:none">登出 Google</button>
    <div style="font-size:11px;color:var(--muted);line-height:1.5">本機自動儲存仍會保留；雲端用於跨裝置同步與備份。</div>
  </div>
</div>

<div class="backup-panel" id="backupPanel">
  <div class="lib-head">
    <strong>📦 專案備份 / 還原</strong>
    <button class="close" id="closeBackup">×</button>
  </div>
  <div style="padding:14px;display:grid;gap:10px">
    <button class="smallbtn primary" id="exportJsonBtn">⬇ 匯出整個專案 JSON</button>
    <button class="smallbtn" id="importJsonBtn">⬆ 匯入專案 JSON</button>
    <input id="importJsonInput" type="file" accept=".json,application/json" hidden>
    <div style="font-size:12px;color:var(--muted);line-height:1.55">
      JSON 會包含所有樓層、牆、門窗、家具、文字、圖形、群組與畫布位置。<br>
      匯入時會先自動備份目前資料，再用匯入內容取代目前專案。
    </div>
  </div>
</div>
<div class="floor-menu" id="floorMenu">
  <button id="renameFloor">✏️ 重新命名</button>
  <button id="duplicateFloor">⧉ 複製樓層</button>
  <button id="deleteFloor" class="danger">🗑 刪除樓層</button>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const canvas=$('canvas'),ctx=canvas.getContext('2d'),wrap=$('canvasWrap');
const STORAGE_KEY='floor-plan-app-v1',GRID_CM=20,BASE=.45;
const CLOUD_GAS_URL='https://script.google.com/macros/s/AKfycbxZ18TnRfJuGkMkMVX7Qepj3_Z9Jd3PbhY8QiBecGZ3PIcaRwowi8b7T7PWvMQEA5-2/exec';
const CLOUD_CLIENT_ID_KEY='floor-plan-google-client-id';
let googleIdToken='',googleProfile=null,googleCredentialExpiresAt=0;
let dpr=1,tool='select',zoom=1,camera={x:80,y:80},drawing=null,panning=null,dragging=null,resizing=null,wallResizing=null,rotating=null,selected=null,placementType=null,history=[],future=[],objectSnap=false,multiSelectMode=false,multiSelected=new Set(),hoverTarget=null,selectAllMode=false,floorClipboard=null;

const CATALOG={
  '房間':[
    ['bed','🛏️','床',180,200],['singlebed','🛏️','單人床',100,190],['wardrobe','🚪','衣櫃',120,60],
    ['desk','🪑','書桌',120,60],['sofa','🛋️','沙發',180,85],['tv','📺','電視',120,35]
  ],
  '衛浴':[
    ['toilet','🚽','馬桶',70,120],['sink','🚰','洗手台',70,55],['shower','🚿','淋浴區',90,90],
    ['bathtub','🛁','浴缸',160,75],['washer','🧺','洗衣機',65,65]
  ],
  '廚房':[
    ['fridge','🧊','冰箱',80,75],['cooktop','🔥','爐台',90,60],['kitchensink','🚰','廚房水槽',90,60],
    ['counter','▤','流理台',180,60],['cabinet','▥','廚櫃',120,60],['island','▰','中島',160,80],
    ['dining','🍽️','餐桌',140,80]
  ],
  '建築':[
    ['stairs','🪜','樓梯',100,240],['column','▣','柱子',40,40],['altar','🛕','神明桌',110,80],
    ['motorcycle','🏍️','摩托車',75,190]
  ]
};

function id(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
function normalize(data){
  if(!data||!data.floors)return {version:3,floors:[{id:id(),name:'1F',walls:[],objects:[],view:{zoom:1,x:80,y:80}}],activeFloorId:null};

 g.addColorStop(0,'#d6a35d');g.addColorStop(.45,'#b97833');g.addColorStop(1,'#8b5728');return g
}
function metalGradient(x,y,w,h){
 const g=ctx.createLinearGradient(x,y,x+w,y+h);
 g.addColorStop(0,'#f7f7f7');g.addColorStop(.45,'#cfd3d6');g.addColorStop(1,'#8e969c');return g
}
function fabricGradient(c1,c2){
 const g=ctx.createLinearGradient(0,-50,0,50);g.addColorStop(0,c1);g.addColorStop(1,c2);return g
}

}function nearestWall(p,max=90){
 let best=null,bd=Infinity,proj=null;
 for(const w of floor().walls){
  const ax=w.a.x,ay=w.a.y,bx=w.b.x,by=w.b.y,dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(!l2)continue;
  let t=((p.x-ax)*dx+(p.y-ay)*dy)/l2;t=Math.max(0,Math.min(1,t));let q={x:ax+t*dx,y:ay+t*dy},d=Math.hypot(p.x-q.x,p.y-q.y);
  if(d<bd){bd=d;best=w;proj=q}
 }
 return bd<=max?{wall:best,p:proj,angle:Math.atan2(best.b.y-best.a.y,best.b.x-best.a.x)*180/Math.PI}:null
}
function objectLocalPoint(o,p){
 const dx=p.x-o.x,dy=p.y-o.y,a=-(o.rot||0)*Math.PI/180;
 return{x:dx*Math.cos(a)-dy*Math.sin(a),y:dx*Math.sin(a)+dy*Math.cos(a)}
}
function hitWallEndpoint(w,p){
 const tol=20/(BASE*zoom);
 if(Math.hypot(p.x-w.a.x,p.y-w.a.y)<=tol)return'a';
 if(Math.hypot(p.x-w.b.x,p.y-w.b.y)<=tol)return'b';
 return null;
}
function hitRotationHandle(o,p){
 if(!o)return false;
 const q=objectLocalPoint(o,p);
 const rotY=-o.h/2-(32/(BASE*zoom));
 const tol=18/(BASE*zoom);
 return Math.hypot(q.x,q.y-rotY)<=tol;
}
function hitResizeHandle(o,p){
 if(!o||o.type==='door'||o.type==='window')return null;
 const q=objectLocalPoint(o,p), tol=18/(BASE*zoom);
 const pts=[
  ['nw',-o.w/2,-o.h/2],['n',0,-o.h/2],['ne',o.w/2,-o.h/2],['e',o.w/2,0],
  ['se',o.w/2,o.h/2],['s',0,o.h/2],['sw',-o.w/2,o.h/2],['w',-o.w/2,0]
 ];
 for(const h of pts)if(Math.abs(q.x-h[1])<=tol&&Math.abs(q.y-h[2])<=tol)return h[0];
 return null;
}
function hit(p){
 let best=null;
 // Objects are tested from topmost to bottommost.
 // The whole visible body is draggable — users do not need to grab the border.
 for(let i=floor().objects.length-1;i>=0;i--){
   const o=floor().objects[i],q=objectLocalPoint(o,p);
   const pad=Math.max(10,14/(BASE*zoom));
   const halfW=Math.max((o.w||20)/2,22/(BASE*zoom));
   const halfH=Math.max((o.h||20)/2,22/(BASE*zoom));
   if(Math.abs(q.x)<=halfW+pad && Math.abs(q.y)<=halfH+pad){
     return{kind:'object',id:o.id}
   }
 }
 let limit=28/(BASE*zoom),bd=Infinity;
 for(const w of floor().walls){
   let d=segDist(p,w.a,w.b);
   if(d<limit&&d<bd){bd=d;best={kind:'wall',id:w.id}}
 }
 return best
}
function segDist(p,a,b){let dx=b.x-a.x,dy=b.y-a.y;if(!dx&&!dy)return Math.hypot(p.x-a.x,p.y-a.y);let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy)}
function getSelected(){if(!selected)return null;return selected.kind==='wall'?floor().walls.find(x=>x.id===selected.id):floor().objects.find(x=>x.id===selected.id)}
function groupMembers(o){
 if(!o?.groupId)return o?[o]:[];
 return floor().objects.filter(x=>x.groupId===o.groupId)
}

function cloneWithNewIds(items){
 const idMap=new Map();
 items.forEach(x=>idMap.set(x.id,id()));
 return items.map(x=>{
   const c=JSON.parse(JSON.stringify(x));
   c.id=idMap.get(x.id);
   if(c.groupId){
     if(!idMap.has('group:'+c.groupId))idMap.set('group:'+c.groupId,id());
     c.groupId=idMap.get('group:'+c.groupId);
   }
   return c
 })
}

}
function clearSelectAll(){

}
function copyCurrentFloor(){
 floorClipboard={
   sourceFloorId:floor().id,
   walls:JSON.parse(JSON.stringify(floor().walls)),
   objects:JSON.parse(JSON.stringify(floor().objects))
 };
 toast('已複製目前樓層全部內容')
}
function pasteToCurrentFloor(){
 if(!floorClipboard)return toast('剪貼簿目前沒有樓層內容');
 if(!floorClipboard.walls.length&&!floorClipboard.objects.length)return toast('沒有可以貼上的內容');
 snapshot();

 const wallCopies=cloneWithNewIds(floorClipboard.walls);
 const objCopies=cloneWithNewIds(floorClipboard.objects);

 // Slight offset when pasting onto same floor, exact position on other floors.
 const sameFloor=floorClipboard.sourceFloorId===floor().id;
 const offset=sameFloor?40:0;
 wallCopies.forEach(w=>{
   w.a.x+=offset;w.a.y+=offset;w.b.x+=offset;w.b.y+=offset;
 });
 objCopies.forEach(o=>{o.x+=offset;o.y+=offset});

 floor().walls.push(...wallCopies);
 floor().objects.push(...objCopies);
 selectAllMode=false;selected=null;save();draw();
 toast('已貼到 '+floor().name)
}


function setTool(t){
 if(multiSelectMode)exitGroupMode();
 if(t==='library'){openLibrary();return}
 if(t==='shape'){openCustom('shape');return}
 if(t==='text'){openCustom('text');return}
 if(t==='more'){openCustom('shape');return}
 tool=t;placementType=null;selected=null;updateProps();
 document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
 $('status').textContent=t==='wall'?'畫牆：拖曳起點到終點｜吸附 20 cm 格線':t==='door'?'門：可放任意位置；靠近牆時會自動貼齊':t==='window'?'窗：可放任意位置；靠近牆時會自動貼齊':t==='pan'?'拖曳移動畫布':'選取：可直接拖移物件；☑️全選後可📋複製，切樓層後📥貼上';
 canvas.style.cursor=t==='wall'?'crosshair':t==='pan'?'grab':'default';draw()
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture(e.pointerId);let s=pointer(e),raw=S2W(s),w=snapPoint(raw);
 if(tool==='wall'){drawing={a:w,b:w,thickness:20};return draw()}
 if(tool==='pan'){panning={sx:s.x,sy:s.y,cx:camera.x,cy:camera.y};return}
 if(tool==='door'||tool==='window'){
   let n=nearestWall(raw,55),p=objectPoint(raw),rot=0;
   if(n){p=n.p;rot=n.angle}
   snapshot();
   floor().objects.push({
     id:id(),type:tool,label:tool==='door'?'門':'窗',
     x:p.x,y:p.y,w:tool==='door'?90:120,h:20,rot,
     hingeRight:false,outward:false
   });
   save();draw();
   toast(n?(tool==='door'?'門已貼齊牆面':'窗已貼齊牆面'):(tool==='door'?'門已自由放置':'窗已自由放置'));
   return
 }
 if(placementType){
 snapshot();let p=objectPoint(raw),o,label;
 if(placementType.startsWith('__customShape__')){
   let s=placementType.replace('__customShape__',''),d=SHAPES.find(x=>x[0]===s)||SHAPES[0];
   o={id:id(),type:d[1],label:d[3],x:p.x,y:p.y,w:d[4],h:d[5],rot:0};label=d[3]
 }else if(placementType.startsWith('__customText__')){
   let rest=placementType.replace('__customText__',''),parts=rest.split('|'),vertical=parts[0]==='V',text=decodeURIComponent(parts.slice(1).join('|'));
   o={id:id(),type:'text',label:'文字',text,vertical,x:p.x,y:p.y,w:Math.max(80,text.length*30),h:vertical?Math.max(80,text.length*32):60,rot:0,fontSize:22};label='文字'
 }else{
   let def=findDef(placementType);o={id:id(),type:def[0],label:def[2],x:p.x,y:p.y,w:def[3],h:def[4],rot:0};if(def[0]==='stairs')o.stairsDown=false;label=def[2]
 }
 floor().objects.push(o);save();selected={kind:'object',id:o.id};placementType=null;setTool('select');updateProps();draw();toast(label+' 已放置');return
}
 if(tool==='select'){
   if(multiSelectMode){
     const h=hit(raw);
     if(h?.kind==='object'){
       if(multiSelected.has(h.id))multiSelected.delete(h.id);else multiSelected.add(h.id);
       updateGroupBar();draw()
     }else toast('群組只能選擇文字、圖形或家具');
     return
   }
   if(selected?.kind==='wall'){
     let existing=getSelected(),end=hitWallEndpoint(existing,raw);
     if(end){
       wallResizing={end,orig:JSON.parse(JSON.stringify(existing)),id:existing.id,moved:false};
       return;
     }
   }
   if(selected?.kind==='object'){
     let existing=getSelected();
     if(hitRotationHandle(existing,raw)){
       const center={x:existing.x,y:existing.y};
       const startAngle=Math.atan2(raw.y-center.y,raw.x-center.x)*180/Math.PI;
       rotating={id:existing.id,orig:JSON.parse(JSON.stringify(existing)),startAngle,origRot:existing.rot||0,moved:false};
       return;
     }
     let handle=hitResizeHandle(existing,raw);
     if(handle){
       resizing={handle,start:raw,orig:JSON.parse(JSON.stringify(existing)),id:existing.id,moved:false};
       return;
     }
   }
   selected=hit(raw);updateProps();
   if(selected){
     let obj=getSelected();
     if(selected.kind==='object'){
       const members=groupMembers(obj);
       dragging={
         start:raw,kind:'object',moved:false,before:JSON.stringify(app),
         originals:members.map(x=>({id:x.id,x:x.x,y:x.y}))
       };
       canvas.style.cursor='grabbing';
     }else{
       dragging={start:raw,orig:JSON.parse(JSON.stringify(obj)),kind:'wall',moved:false,before:JSON.stringify(app)}
     }
   }
   draw()
 }
});
canvas.addEventListener('pointermove',e=>{
 let s=pointer(e),raw=S2W(s);
 if(!drawing&&!panning&&!dragging&&!resizing&&!wallResizing&&!rotating&&tool==='select'&&!multiSelectMode){
   const h=hit(raw);
   hoverTarget=h;
   canvas.style.cursor=h?.kind==='object'?'grab':h?.kind==='wall'?'pointer':'default';
 }
 if(drawing){let end=snapPoint(raw),dx=Math.abs(end.x-drawing.a.x),dy=Math.abs(end.y-drawing.a.y);if(dx<40)end.x=drawing.a.x;if(dy<40)end.y=drawing.a.y;drawing.b=end;return draw()}
 if(panning){camera.x=panning.cx+s.x-panning.sx;camera.y=panning.cy+s.y-panning.sy;return draw()}
 if(wallResizing){
   let w=floor().walls.find(x=>x.id===wallResizing.id);if(!w)return;
   let p=snapPoint(raw);
   const other=wallResizing.end==='a'?w.b:w.a;
   const dx=Math.abs(p.x-other.x),dy=Math.abs(p.y-other.y);
   if(dx<40)p.x=other.x;
   if(dy<40)p.y=other.y;
   w[wallResizing.end]=p;
   wallResizing.moved=true;draw();return
 }
 if(rotating){
   let o=floor().objects.find(x=>x.id===rotating.id);if(!o)return;
   const angle=Math.atan2(raw.y-o.y,raw.x-o.x)*180/Math.PI;
   let next=rotating.origRot+(angle-rotating.startAngle);
   o.rot=((next%360)+360)%360;
   rotating.moved=true;draw();return
 }
 if(resizing){
   let o=floor().objects.find(x=>x.id===resizing.id);if(!o)return;
   let orig=resizing.orig,q=objectLocalPoint(orig,raw),min=20;
   let left=-orig.w/2,right=orig.w/2,top=-orig.h/2,bottom=orig.h/2;
   if(resizing.handle.includes('w'))left=Math.min(q.x,right-min);
   if(resizing.handle.includes('e'))right=Math.max(q.x,left+min);
   if(resizing.handle.includes('n'))top=Math.min(q.y,bottom-min);
   if(resizing.handle.includes('s'))bottom=Math.max(q.y,top+min);
   let nw=Math.max(min,right-left),nh=Math.max(min,bottom-top);
   if(o.type==='shapeSquare'){
     let size=Math.max(nw,nh);nw=size;nh=size;
   }
   const localCx=(left+right)/2,localCy=(top+bottom)/2,a=(orig.rot||0)*Math.PI/180;
   o.x=orig.x+localCx*Math.cos(a)-localCy*Math.sin(a);
   o.y=orig.y+localCx*Math.sin(a)+localCy*Math.cos(a);
   o.w=objectSnap?(snap(nw)||min):Math.max(min,nw);o.h=objectSnap?(snap(nh)||min):Math.max(min,nh);
   resizing.moved=true;updateProps();draw();return
 }
 if(dragging){let obj=getSelected();if(!obj)return;if(dragging.kind==='object'){
   const dx=raw.x-dragging.start.x,dy=raw.y-dragging.start.y;
   dragging.originals.forEach(orig=>{
     const member=floor().objects.find(x=>x.id===orig.id);if(!member)return;
     const p=objectPoint({x:orig.x+dx,y:orig.y+dy});member.x=p.x;member.y=p.y
   })
 }else{
   let dx=snap(raw.x-dragging.start.x),dy=snap(raw.y-dragging.start.y);
   obj.a={x:dragging.orig.a.x+dx,y:dragging.orig.a.y+dy};obj.b={x:dragging.orig.b.x+dx,y:dragging.orig.b.y+dy}
 }
 dragging.moved=true;draw()}
});

 if(drawing){let len=Math.hypot(drawing.b.x-drawing.a.x,drawing.b.y-drawing.a.y);if(len>=GRID_CM){snapshot();floor().walls.push({id:id(),...drawing});save();toast('牆已建立')}drawing=null;draw()}
 if(wallResizing){

   e.preventDefault();const pts=[...mobilePointers.values()],dx=pts[1].x-pts[0].x,dy=pts[1].y-pts[0].y,dist=Math.max(1,Math.hypot(dx,dy));

 }
},{capture:true,passive:false});
function endMobilePointer(e){if(!isMobile())return;mobilePointers.delete(e.pointerId);if(mobilePointers.size<2&&mobileGesture){mobileGesture=null;storeView();save()}}
canvas.addEventListener('pointerup',endMobilePointer,{capture:true});canvas.addEventListener('pointercancel',endMobilePointer,{capture:true});

document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();selectAllCurrentFloor();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'&&selectAllMode){e.preventDefault();copyCurrentFloor();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'&&floorClipboard){e.preventDefault();pasteToCurrentFloor();return}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}
 if((e.key==='Delete'||e.key==='Backspace')&&selected){e.preventDefault();deleteSelected()}
 if(e.key==='Escape'){
   if(multiSelectMode){exitGroupMode();return}
   drawing=null;dragging=null;resizing=null;wallResizing=null;rotating=null;selected=null;placementType=null;updateProps();draw()
 }});
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout($('toast')._t);$('toast')._t=setTimeout(()=>$('toast').classList.remove('show'),1500)}

loadView();renderFloors();resize();updateZoom();save();
const lastCloudSync=localStorage.getItem('floor-plan-last-cloud-sync');if(lastCloudSync)$('cloudSyncInfo').textContent='最後同步：'+formatCloudTime(lastCloudSync);updateCloudUI();if(getCloudClientId())initGoogleSignIn();
})();
</script>
